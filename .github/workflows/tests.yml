name: Skill checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, checked 2026-09-29
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, checked 2026-09-29
        with:
          python-version: ${{ matrix.python-version }}
      - run: python tools/run_checks.py
      - run: python tools/demo.py
      - run: python tools/demo_case.py --output ../conference-helper-demo
      - run: python tools/build_release.py --output ../conference-helper-release
